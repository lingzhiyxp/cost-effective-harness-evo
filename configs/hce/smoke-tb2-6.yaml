_base: "../base.yaml"
_name: "hce-smoke-tb2-6"
_description: "HCE end-to-end smoke: 6 shortest TB2 training tasks, one iteration"
_tags: ["hce", "smoke"]

source_config_dir: "agents/code_agent_simple"
agent_config_filename: "code_agent.yaml"

# The smoke set is the six shortest tasks of the 42-task training half, so the
# run exercises every stage without waiting on 12000-second tasks.
path: "../reset-free-coding-agent-harness/dataset/tb2-smoke6"

max_iterations: 2          # iteration 1 profiles, iteration 2 exercises selection
target_pass_rate: 1.01     # never terminate early; the smoke test is the point

harbor:
  k: 1                     # smoke only; the real run uses k=3
  n_concurrent: 6
  e2b_sandbox_timeout: 26000   # 3600 is not enough for TB2: env start + agent + verifier
  agent_import_path: "harbor_traced_agent:TracedNexAU"

harbor_job_timeout_minutes: 60
experiment_timeout_minutes: 180

llm:
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL}"
  model: "gpt-5.4-mini"

# additional_drop_params is mandatory, not an optimisation: gpt-5 family models
# return 400 when temperature/top_p arrive alongside reasoning.effort, and
# code_agent.yaml hardcodes both. Omitting it fails every trial in the batch.
code_agent_patch:
  tool_call_mode: openai
  llm_config:
    api_type: openai_responses
    additional_drop_params: ["temperature", "top_p"]
    reasoning:
      effort: "medium"

evolve_agent:
  tool_call_mode: openai
  llm_config:
    api_key: "${LLM_API_KEY}"
    base_url: "${LLM_BASE_URL}"
    model: "gpt-5.4-mini"
    api_type: openai_responses
    additional_drop_params: ["temperature", "top_p"]
    reasoning:
      effort: "medium"

explore_agent:
  enabled: false           # one-off knowledge gathering is not what this tests

agent_debugger:
  enabled: true
  max_tasks: 3
  max_concurrent: 3
  llm:
    api_key: "${ADB_LLM_API_KEY}"
    base_url: "${ADB_LLM_BASE_URL}"
    model: "gpt-5.4-mini"

post_evolve:
  enabled: false

notify:
  enabled: false

hce:
  enabled: true
  selector: hce
  # Six tasks cannot be split 19/41/40 into three non-empty buckets, so the
  # smoke run takes a larger share to keep every stratum populated. The real
  # run uses the configured 0.40.
  budget_frac: 0.70
  min_audit: 1
  profiling: {k: 1, from_iteration: 1}
